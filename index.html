<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Project</title>
</head>

<body>
    <div class="container">
        <form onsubmit="return validateForm()">
            <i class="fa-solid fa-paper-plane"></i>
            <div class="input-group">
                <label>Full name</label>
                <input type="text" placeholder="Enter your name" id="contact-name" onkeyup="validateName()">
                <span class="name-error"></span>
            </div>
            <div class="input-group">
                <label>Phone</label>
                <input type="number" placeholder="213 123 7890" id="contact-phone" onkeyup="validatePhone()">
                <span class="phone-error"></span>
            </div>
            <div class="input-group">
                <label>Email Id</label>
                <input type="email" placeholder="Enter Email" id="contact-email" onkeyup="validateEmail()">
                <span class="email-error"></span>
            </div>
            <div class="input-group">
                <label>Your message</label>
                <textarea placeholder="Enter your message" id="contact-message" onkeyup="validateMessage()"></textarea>
                <span class="message-error"></span>
            </div>
            <button type="submit">submit</button>
            <span class="submit-error"></span>
        </form>
    </div>

    <script src="main.js"></script>
</body>

</html>
